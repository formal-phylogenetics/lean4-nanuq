name = "Nanuq"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of NANUQ (Allman, Baños, Rhodes 2019)"
defaultTargets = ["Nanuq"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "3fcabfd7d191990dda268b0b3968d945b65eb59a"

# The hub of this paper: what the papers on network estimation share.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/vltanh/lean4-phylo-network"
rev = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"

# Allman, Baños, Mitchell, Rhodes 2023, whose results this paper's proofs use.
[[require]]
name = "Allman2023"
git = "https://github.com/vltanh/lean4-allman2023"
rev = "46efa61d0988df12649089689ae77bc100be034f"

# TINNiK (Allman, Baños, Mitchell, Rhodes 2024), whose results this paper's proofs use.
[[require]]
name = "Tinnik"
git = "https://github.com/vltanh/lean4-tinnik"
rev = "de514e1f14522531f16dcdfa12244fe72fe05944"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of this repository is under Nanuq/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "Nanuq"
globs = ["Nanuq.+"]
