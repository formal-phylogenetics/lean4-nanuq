# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "NANUQ: a method for inferring species networks from gene trees under the coalescent model"
  description: >-
    A Lean formalization, in progress, of NANUQ (Allman, Baños, Rhodes 2019), which infers a level-1 species network
    from gene tree quartets with hypothesis tests and a network quartet distance. No result of the literature is
    assumed. No person has reviewed the proofs.


    Proved: the statistical consistency of the algorithm (Theorem 36) down to the network quartet distance of its Step
    3, which is what the paper's proof shows, with a correction of its hypothesis: as printed it allows the centroid
    concordance factor, at which it fails; for generic parameters with the printed hypothesis; and with gene trees on
    subsets of the taxa. Proposition 9, which the paper takes from its references, on binary level-1 networks, by an
    argument of its own; the paper's definitions of the types of cycle, of the quartet network and of the distance,
    with bridges to the library's; Theorem 17; the running time, with Steps 4 and 5 as costs. Not formalized: Steps 4 and 5
    (NeighborNet, the Circular Network algorithm) and the results on split systems and splits graphs. The statements
    of record are Theorem 36, corrected and for generic parameters, in the Challenge, on definitions in Mathlib's
    vocabulary.


    The audit records E1 to E4 on Theorem 36 and its proof, and E84 on Definition 11.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["q-bio.PE", "math.ST"]
  msc2020: ["92D15", "92B10", "05C90", "62F03", "60J28"]

sources:
