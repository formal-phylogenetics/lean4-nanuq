  - title: "The tree of blobs of a species network: identifiability under the coalescent"
    authors:
      - "Elizabeth S. Allman"
      - "Hector Baños"
      - "Jonathan D. Mitchell"
      - "John A. Rhodes"
    id: "doi:10.1007/s00285-022-01838-9"
    type: "article"
    location: "https://doi.org/10.1007/s00285-022-01838-9"
    relationship: "background"
    note: "Not cited by the paper, which is earlier; the formalization reads the paper's semidirected network and quartet networks in its language. It is formalized in its own repository, lean4-allman2023; the facts the proofs use are stated in Nanuq/External/Allman2023 and proved from that repository's theorems, which the directory's README names."
  - title: "TINNiK: inference of the tree of blobs of a species network under the coalescent model"
    authors:
