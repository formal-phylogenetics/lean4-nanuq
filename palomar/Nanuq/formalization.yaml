    type: "article"
    location: "https://doi.org/10.1109/TCBB.2019.2917204"
    relationship: "background"
    note: "Cited for the quartet distance on a tree; Theorem 2 is proved in lean4-phylo-network/PhyloNetwork/External/Rhodes2020, and gives the paper's Theorem 17 here."
  - title: "Identifying species network features from gene tree quartets under the coalescent model"
