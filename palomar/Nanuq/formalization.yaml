      - "Hector Baños"
      - "John A. Rhodes"
    id: "doi:10.1186/s13015-019-0159-2"
    type: "article"
    location: "https://doi.org/10.1186/s13015-019-0159-2"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Hypothesis testing near singularities and boundaries"
    authors:
      - "Jonathan D. Mitchell"
      - "Elizabeth S. Allman"
      - "John A. Rhodes"
