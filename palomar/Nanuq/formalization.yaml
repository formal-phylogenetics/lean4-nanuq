related_formalizations:
  - id: "https://github.com/vltanh/lean4-phylogenetics"
    relationship: "adapts"
    note: "This repository imports this library, pinned at commit 3fcabfd, for its definitions and general results; the Challenge restates the definitions it needs in Mathlib's vocabulary, and Nanuq/Bridge proves that they are the library's."

status:
  scope: >-
    In progress, and unconditional: no result of the literature is assumed. Proved: Theorem 36 down to the distance of
    Step 3, corrected (E1) and for generic parameters, with gene trees on subsets of the taxa; Proposition 9 (all three
    parts) on binary level-1 networks; Definitions 4, 5, 20 and 22 with their bridges; Theorem 17; the running time as a
    count of operations, with Steps 4 and 5 as costs. Not formalized: Steps 4 and 5 and the reading of the output's splits graph,
    the results on split systems and splits graphs (Theorems 15, 23, 34, Corollaries 16, 24, 31, 35, Lemmas 19, 21,
    25-28, 32, 33, Proposition 30), Proposition 10 beyond the printed formula and one network, the examples and the
    data analyses. The Challenge states Theorem 36, the paper's main result, corrected and for generic parameters; the
    other results are in the library. See Section 9 of docs/Nanuq/REPORT.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: "formalize-math-paper skill, repository vltanh/formalize-math-paper; sub-agents. The formalization was made in lean4-phylo-tree-of-blobs with the papers on the tree of blobs, from 2026-10-31 to 2026-11-04, and moved to this repository on 2026-11-21; the layout of the collection and the Challenge on 2026-11-25."
      cost:
        wall_time: "not tracked for this paper alone: lean4-phylo-tree-of-blobs's docs/CREDITS.md at 6e7bc49 gives the figures of the whole project, which are not separated by paper"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "The user asked for the papers on the tree of blobs and the sources they cite, then for each paper to move to a repository of its own, and for the layout of the collection."
  spend_usd: "not tracked"
  notes: >-
    The user chose the paper and decided the layout. AI systems wrote the code, the statements, the audit and the
    documents. Nanuq/ is the library; the audit checks every declaration of this repository and of the libraries it
    requires, all on the standard axioms. See docs/Nanuq/CREDITS.md.

fidelity:
  divergences: >-
    Statement corrected (Section 3 of docs/Nanuq/REPORT.md): Theorem 36 needs that no set of four taxa has the centroid
    concordance factor (E1); the Challenge states it with this hypothesis, and for generic parameters with the printed
    one. Readings (Section 6 of the report): Theorem 36 concludes at the distance of Step 3, which is what its proof
    shows; Proposition 9 is stated on a set of four taxa of a whole network, with the paper's form proved equivalent.


    Departures from the paper's proofs, in Section 7 of the report: Proposition 9 has no printed proof and is proved by
    an argument of its own; the proof of Theorem 36 takes the maximum of other levels, since the printed minimum of
    undetermined levels does not work (E2, E3). The routes of the paper's proofs are not recorded yet.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements of the papers formalized in lean4-phylo-tree-of-blobs against the sources. The axiom
    audit and the Challenge's copy of the definitions are checked locally, and Comparator (Lean's kernel and NanoDa)
    and con-ron run through scripts/check_kernels.sh.

alignment:
  namespace: "NanuqChallenge"
  statements:
    - source: "NANUQ, Theorem 36, corrected"
      lean: "NanuqChallenge.theorem36"
      module: "Nanuq.Challenge"
      status: "proved"
      note: "Down to the distance of Step 3, with the hypothesis NoCentroidCF (E1). The library's Nanuq.theorem36_output gives the steps after the distance; Nanuq.theorem36_missing, gene trees on subsets of the taxa; Nanuq.ThreeTwo.not_theorem36AsPrinted_N₃ the failure as printed."
    - source: "NANUQ, Theorem 36, for generic parameters"
      lean: "NanuqChallenge.theorem36_generic"
      module: "Nanuq.Challenge"
      status: "proved"
      note: "With the hypothesis as printed, off a null set of parameters, for the distance of Step 3."

acknowledgements: "Lean, Mathlib; the libraries of the collection (lean4-phylogenetics, lean4-phylo-network) and the repositories lean4-allman2023 and lean4-tinnik; the authors of the paper and its sources."
